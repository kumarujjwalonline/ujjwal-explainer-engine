name: Bench 3D render settings
on:
  workflow_dispatch:
    inputs:
      job_id: {default: test-new-visuals}
      scene: {default: S01}
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        v:
          - {conc: 4, gl: swangle, dpr: 0.6, aa: true}
          - {conc: 4, gl: swangle, dpr: 0.6, aa: false}
          - {conc: 1, gl: swangle, dpr: 0.6, aa: false}
          - {conc: 2, gl: swangle, dpr: 0.6, aa: false}
          - {conc: 4, gl: swangle, dpr: 0.4, aa: false}
          - {conc: 4, gl: swiftshader, dpr: 0.6, aa: false}
          - {conc: 4, gl: angle, dpr: 0.6, aa: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: package.json}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          npm install --no-audit --no-fund && npx remotion browser ensure
      - run: |
          mkdir -p out && cp jobs/${{ inputs.job_id }}.json out/job.final.json
          node scripts/render.mjs out/job.final.json bench ${{ inputs.scene }} 30 89 ${{ matrix.v.conc }} ${{ matrix.v.gl }} ${{ matrix.v.dpr }} ${{ matrix.v.aa }}
